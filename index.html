<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배드민턴 클럽 운영 프로그램</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Jua', sans-serif; background-color: #f0fdf4; color: #1f2937; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); border: 2px solid rgba(255,255,255,0.5); }
        .cute-button { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .cute-button:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .cute-button:active { transform: translateY(0); }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 구글 앱스 스크립트 웹앱 URL (참가자 명단 기록/삭제용)
        // 아래 가이드를 따라 발급받은 URL을 "" 안에 붙여넣으세요.
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmA3qsJlHoqClusjI6cKGb1enghbCn9_uHVeb2wNeuVaHYsl7DkC5tMweV_qalnABC/exec"; 

        // --- Mock Data & Constants ---
        const DEFAULT_SETTINGS = {
            clubName: "우리동네 배드민턴 클럽",
            adminPin: "1234",
            numCourts: 4,
            ageGroups: ["10대", "20대", "30대", "40대", "50대", "60대 이상"],
            levels: ["초심", "D조", "C조", "B조", "A조", "자강"],
            genders: ["남", "여"]
        };

        // --- Helper: CSV Parser ---
        const parseCSV = (text) => {
            return text.split('\n').filter(row => row.trim() !== '').map(row => {
                const cols = [];
                let inQuotes = false;
                let current = '';
                for (let i = 0; i < row.length; i++) {
                    if (row[i] === '"') { inQuotes = !inQuotes; continue; }
                    if (row[i] === ',' && !inQuotes) { cols.push(current.trim()); current = ''; continue; }
                    current += row[i];
                }
                cols.push(current.trim());
                return cols.map(c => c.replace(/\r/g, ''));
            });
        };

        // --- Helper: TTS ---
        const speak = (text) => {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        };

        // --- Main Component ---
        const App = () => {
            const params = new URLSearchParams(window.location.search);
            const isMobileMode = params.get('mode') === 'mobile_register';

            // State
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [players, setPlayers] = useState([]);
            const [activeMatches, setActiveMatches] = useState([]); // { id, courtNum, players, startTime }
            const [waitingMatches, setWaitingMatches] = useState([]); // { id, players }
            const [selectedForMatch, setSelectedForMatch] = useState([]);
            
            // Modal States
            const [showRegister, setShowRegister] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [showAdminAuth, setShowAdminAuth] = useState(false);
            const [mobileRegComplete, setMobileRegComplete] = useState(false);
            
            // Interaction States
            const [currentTime, setCurrentTime] = useState(Date.now());
            const [swapSelection, setSwapSelection] = useState(null); // { matchId, playerId }

            // Timer for updating wait times
            useEffect(() => {
                const interval = setInterval(() => setCurrentTime(Date.now()), 10000); // 10초마다 갱신
                return () => clearInterval(interval);
            }, []);

            // Google Sheets Fetch (설정 시트 데이터 연동)
            useEffect(() => {
                const fetchSettings = async () => {
                    try {
                        console.log("구글 시트(설정) 데이터 연동 시도 중...");
                        const response = await fetch('https://docs.google.com/spreadsheets/d/195_S4M35HMyitcT1NFh9_fzHAT22u72_AL4sFzxmHzY/export?format=csv&gid=0');
                        if (!response.ok) throw new Error("네트워크 응답이 올바르지 않습니다.");
                        
                        const text = await response.text();
                        const rows = parseCSV(text);
                        
                        if (rows.length > 1) {
                            // 2행 (인덱스 1) 데이터에서 인증번호(A2)와 클럽명(B2) 추출
                            const adminPin = rows[1][0] || DEFAULT_SETTINGS.adminPin; 
                            const clubName = rows[1][1] || DEFAULT_SETTINGS.clubName; 
                            
                            const ageGroups = [];
                            const levels = [];
                            const genders = [];
                            
                            // 2행부터 마지막 행까지 돌면서 데이터 추출
                            for (let i = 1; i < rows.length; i++) {
                                // D열 (인덱스 3), E열 (인덱스 4), F열 (인덱스 5)
                                if (rows[i][3] && rows[i][3] !== "") ageGroups.push(rows[i][3]);
                                if (rows[i][4] && rows[i][4] !== "") levels.push(rows[i][4]);
                                if (rows[i][5] && rows[i][5] !== "") genders.push(rows[i][5]);
                            }

                            setSettings(prev => ({
                                ...prev,
                                adminPin: adminPin,
                                clubName: clubName,
                                ageGroups: ageGroups.length > 0 ? Array.from(new Set(ageGroups)) : prev.ageGroups,
                                levels: levels.length > 0 ? Array.from(new Set(levels)) : prev.levels,
                                genders: genders.length > 0 ? Array.from(new Set(genders)) : prev.genders
                            }));
                            console.log("구글 시트 설정 연동 완료! 클럽명:", clubName);
                        }
                    } catch (error) {
                        console.error("구글 시트 연동 실패:", error);
                    }
                };
                
                fetchSettings();
            }, []);

            // Google Sheets Fetch (참가자 시트 주기적 동기화)
            useEffect(() => {
                if (isMobileMode) return; // 모바일 폼 화면에서는 동기화 중지

                const fetchPlayers = async () => {
                    try {
                        // 한글 시트명을 URL 인코딩하고 캐시를 무효화(&t=Date.now())하여 최신 데이터를 강제로 실시간으로 불러옴
                        const response = await fetch('https://docs.google.com/spreadsheets/d/195_S4M35HMyitcT1NFh9_fzHAT22u72_AL4sFzxmHzY/export?format=csv&sheet=' + encodeURIComponent('참가자') + '&t=' + Date.now());
                        if (!response.ok) return;
                        
                        const text = await response.text();
                        const rows = parseCSV(text);
                        
                        // [핵심 필터링] 불러온 데이터의 1행 1열이 '인증번호'라면 잘못 불러온 것이므로 차단
                        if (rows.length > 0 && rows[0][0] && rows[0][0].includes("인증번호")) {
                            console.warn("오류: 참가자 시트 대신 설정 시트를 불러왔습니다. 동기화를 건너뜁니다.");
                            return;
                        }
                        
                        const newPlayers = [];
                        // 2행(인덱스 1)부터 데이터 읽기
                        for (let i = 1; i < rows.length; i++) {
                            // 빈칸 방지 및 이상한 데이터(0330 등) 2차 방어
                            if (rows[i].length >= 5 && rows[i][0] && !rows[i][0].includes("0330")) {
                                newPlayers.push({
                                    name: rows[i][0],
                                    age: rows[i][1],
                                    level: rows[i][2],
                                    gender: rows[i][3],
                                    id: rows[i][4] // E열이 고유 ID
                                });
                            }
                        }

                        setPlayers(prevPlayers => {
                            const prevMap = new Map(prevPlayers.map(p => [p.id, p]));
                            const merged = [];
                            
                            newPlayers.forEach(np => {
                                if (prevMap.has(np.id)) {
                                    // 기존에 있던 유저면 상태값(status, gamesPlayed 등) 유지
                                    merged.push({ ...prevMap.get(np.id), ...np });
                                    prevMap.delete(np.id);
                                } else {
                                    // 구글시트에 새롭게 추가된 유저
                                    merged.push({ ...np, gamesPlayed: 0, waitStartTime: Date.now(), status: 'waiting' });
                                }
                            });

                            // PC화면에서 수동 추가하여 아직 구글 시트에서 불러오지 못한(딜레이) 유저 임시 유지
                            const NOW = Date.now();
                            prevMap.forEach(lp => {
                                if (lp.localCreatedAt && (NOW - lp.localCreatedAt < 20000)) {
                                    merged.push(lp);
                                }
                            });
                            
                            return merged;
                        });
                    } catch (error) {
                        console.error("참가자 명단 동기화 실패:", error);
                    }
                };

                fetchPlayers(); // 초기 1회 실행
                const interval = setInterval(fetchPlayers, 2000); // 5초 -> 2초마다 동기화하여 속도 대폭 향상
                return () => clearInterval(interval);
            }, [isMobileMode]);

            // --- Handlers ---
            const handleRegisterPlayer = async (e) => {
                e.preventDefault();
                
                // 모바일 환경 등에서 중복 제출을 방지하고 상태를 표시합니다.
                const submitBtn = e.target.querySelector('button[type="submit"]');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 전송 중...';
                }

                const formData = new FormData(e.target);
                const newPlayer = {
                    id: Date.now().toString(),
                    name: formData.get('name'),
                    age: formData.get('age'),
                    level: formData.get('level'),
                    gender: formData.get('gender'),
                    gamesPlayed: 0,
                    waitStartTime: Date.now(),
                    localCreatedAt: Date.now(), // 딜레이 유지를 위한 임시 생성 시간
                    status: 'waiting' // waiting, resting, playing
                };
                
                // 구글 시트 [참가자] 시트에 추가 요청 (Apps Script 통신)
                if (SCRIPT_URL) {
                    try {
                        const qs = new URLSearchParams({
                            action: 'add',
                            id: newPlayer.id,
                            name: newPlayer.name,
                            age: newPlayer.age,
                            level: newPlayer.level,
                            gender: newPlayer.gender
                        }).toString();
                        
                        // [핵심] 모바일 브라우저에서 화면 전환 시 통신이 끊기는 현상을 방지하기 위해 await 사용
                        await fetch(`${SCRIPT_URL}?${qs}`, { method: 'GET', mode: 'no-cors' });
                    } catch (err) { console.error(err); }
                }

                if (!isMobileMode) {
                    setPlayers([...players, newPlayer]);
                    setShowRegister(false);
                } else {
                    setMobileRegComplete(true);
                }
            };

            const handleStatusChange = (id, newStatus) => {
                setPlayers(players.map(p => p.id === id ? { ...p, status: newStatus, waitStartTime: newStatus === 'waiting' ? Date.now() : p.waitStartTime } : p));
                if(newStatus === 'resting') {
                    setSelectedForMatch(selectedForMatch.filter(pid => pid !== id));
                }
            };
            const handleRemovePlayer = async (id) => {
                if(confirm("정말 퇴장처리 하시겠습니까?")) {
                    setPlayers(players.filter(p => p.id !== id));
                    setSelectedForMatch(selectedForMatch.filter(pid => pid !== id));
                    
                    // 구글 시트 [참가자] 시트에서 삭제 요청 (Apps Script 통신)
                    if (SCRIPT_URL) {
                        try {
                            const qs = new URLSearchParams({
                                action: 'delete',
                                id: id
                            }).toString();
                            // 통신 끊김 방지
                            await fetch(`${SCRIPT_URL}?${qs}`, { method: 'GET', mode: 'no-cors' });
                        } catch (err) { console.error(err); }
                    }
                }
            };

            const toggleSelectForMatch = (id) => {
                if (selectedForMatch.includes(id)) {
                    setSelectedForMatch(selectedForMatch.filter(pid => pid !== id));
                } else {
                    if (selectedForMatch.length >= 4) {
                        alert("한 게임에는 4명까지만 선택할 수 있습니다.");
                        return;
                    }
                    setSelectedForMatch([...selectedForMatch, id]);
                }
            };

            const createMatch = () => {
                if (selectedForMatch.length !== 4) {
                    alert("4명을 선택해야 게임을 생성할 수 있습니다.");
                    return;
                }

                const matchPlayers = players.filter(p => selectedForMatch.includes(p.id));
                const usedCourts = activeMatches.map(m => m.courtNum);
                
                // 빈 코트 찾기
                let emptyCourt = null;
                for (let i = 1; i <= settings.numCourts; i++) {
                    if (!usedCourts.includes(i)) {
                        emptyCourt = i;
                        break;
                    }
                }

                // 상태 업데이트: 선수들을 playing으로 변경
                setPlayers(players.map(p => {
                    if (selectedForMatch.includes(p.id)) {
                        return { ...p, status: 'playing', gamesPlayed: p.gamesPlayed + 1 };
                    }
                    return p;
                }));

                const newMatch = {
                    id: Date.now().toString(),
                    players: matchPlayers,
                    startTime: Date.now()
                };

                if (emptyCourt !== null) {
                    // 코트 바로 배정
                    newMatch.courtNum = emptyCourt;
                    setActiveMatches([...activeMatches, newMatch]);
                    announceMatch(newMatch);
                } else {
                    // 코트가 꽉 찼으면 대기열로
                    setWaitingMatches([...waitingMatches, newMatch]);
                }

                setSelectedForMatch([]);
            };

            const announceMatch = (match) => {
                const names = match.players.map(p => p.name).join(", ");
                const text = `${match.courtNum}번 코트. ${names} 선수, 입장해 주시기 바랍니다.`;
                speak(text);
            };

            const finishMatch = (matchId) => {
                const match = activeMatches.find(m => m.id === matchId);
                const matchPlayerIds = match.players.map(p => p.id);

                // 코트 비우기
                const newActiveMatches = activeMatches.filter(m => m.id !== matchId);
                
                // 선수들을 다시 waiting 상태로 복귀 및 타이머 리셋
                setPlayers(players.map(p => {
                    if (matchPlayerIds.includes(p.id)) {
                        return { ...p, status: 'waiting', waitStartTime: Date.now() };
                    }
                    return p;
                }));

                // 대기 중인 매치가 있다면 빈 코트에 배정
                if (waitingMatches.length > 0) {
                    const nextMatch = waitingMatches[0];
                    const remainingWaiting = waitingMatches.slice(1);
                    nextMatch.courtNum = match.courtNum; // 끝난 코트 번호 물려받기
                    newActiveMatches.push(nextMatch);
                    setWaitingMatches(remainingWaiting);
                    announceMatch(nextMatch);
                }

                setActiveMatches(newActiveMatches);
                setSwapSelection(null);
            };

            const cancelWaitingMatch = (matchId) => {
                const match = waitingMatches.find(m => m.id === matchId);
                const matchPlayerIds = match.players.map(p => p.id);
                
                // 매치 취소, 선수들 다시 대기상태로. 게임수 차감
                setPlayers(players.map(p => {
                    if (matchPlayerIds.includes(p.id)) {
                        return { ...p, status: 'waiting', gamesPlayed: Math.max(0, p.gamesPlayed - 1) };
                    }
                    return p;
                }));

                setWaitingMatches(waitingMatches.filter(m => m.id !== matchId));
            };

            // 교체/이동 로직
            const handlePlayerClickInCourt = (matchId, player) => {
                if (!swapSelection) {
                    // 첫 번째 선택
                    setSwapSelection({ matchId, player });
                } else {
                    // 두 번째 선택 - 교체 실행
                    if (swapSelection.matchId === matchId && swapSelection.player.id === player.id) {
                        // 같은 사람 클릭시 선택 취소
                        setSwapSelection(null);
                        return;
                    }

                    // activeMatches 업데이트 복사
                    const updatedMatches = [...activeMatches];
                    
                    const match1 = updatedMatches.find(m => m.id === swapSelection.matchId);
                    const match2 = updatedMatches.find(m => m.id === matchId);

                    const p1Index = match1.players.findIndex(p => p.id === swapSelection.player.id);
                    const p2Index = match2.players.findIndex(p => p.id === player.id);

                    // Swap
                    match1.players[p1Index] = player;
                    match2.players[p2Index] = swapSelection.player;

                    setActiveMatches(updatedMatches);
                    setSwapSelection(null);
                }
            };

            // --- Sub-components ---
            const getWaitTime = (startTime) => {
                const diffMs = currentTime - startTime;
                const diffMins = Math.floor(diffMs / 60000);
                if (diffMins < 1) return "방금 전";
                return `${diffMins}분`;
            };

            // 모바일 전용 등록 화면
            if (isMobileMode) {
                return (
                    <div className="min-h-screen bg-green-50 p-6 flex flex-col items-center justify-center w-full">
                        <div className="bg-white rounded-3xl p-8 w-full max-w-sm shadow-xl animate-fade-in-up">
                            <h2 className="text-2xl font-bold text-green-700 mb-6 text-center leading-tight">🏸 {settings.clubName}<br/><span className="text-gray-700 text-lg">입장 등록</span></h2>
                            {mobileRegComplete ? (
                                <div className="text-center py-10 space-y-4">
                                    <i className="fa-solid fa-circle-check text-6xl text-green-500"></i>
                                    <h3 className="text-xl font-bold text-gray-800">등록이 완료되었습니다!</h3>
                                    <p className="text-sm text-gray-500 bg-gray-50 p-4 rounded-xl">대기자 명단에 추가되었습니다.<br/>이 창을 닫아주세요.</p>
                                </div>
                            ) : (
                                <form onSubmit={handleRegisterPlayer} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">이름</label>
                                        <input required type="text" name="name" className="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-green-400 focus:ring-0 outline-none transition-colors" placeholder="홍길동" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">성별</label>
                                            <select name="gender" className="w-full border-2 border-gray-200 rounded-xl p-3 bg-white focus:border-green-400 outline-none">
                                                {settings.genders.map(g => <option key={g} value={g}>{g}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">연령대</label>
                                            <select name="age" className="w-full border-2 border-gray-200 rounded-xl p-3 bg-white focus:border-green-400 outline-none">
                                                {settings.ageGroups.map(a => <option key={a} value={a}>{a}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">급수</label>
                                        <select name="level" className="w-full border-2 border-gray-200 rounded-xl p-3 bg-white focus:border-green-400 outline-none">
                                            {settings.levels.map(l => <option key={l} value={l}>{l}</option>)}
                                        </select>
                                    </div>
                                    <button type="submit" className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl mt-4 cute-button shadow-md text-lg">
                                        입장하기
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                );
            }

            // PC 관리자(대시보드) 화면
            return (
                <div className="min-h-screen flex flex-col p-4 md:p-6 lg:p-8 w-full max-w-[98%] mx-auto space-y-6">
                    {/* Header */}
                    <header className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-green-100">
                        <div>
                            <p className="text-xs text-green-600 font-bold mb-1">개발자: 가치있는 미래교육 연구소 대표 김병찬</p>
                            <h1 className="text-2xl md:text-3xl font-bold text-green-800 flex items-center gap-2">
                                🏸 {settings.clubName}
                            </h1>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={() => setShowRegister(true)} className="cute-button bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-xl text-sm md:text-base flex items-center gap-2">
                                <i className="fa-solid fa-user-plus"></i> 입장하기
                            </button>
                            <button onClick={() => setShowAdminAuth(true)} className="cute-button bg-gray-100 hover:bg-gray-200 text-gray-700 p-2 rounded-xl">
                                <i className="fa-solid fa-gear"></i>
                            </button>
                        </div>
                    </header>

                    {/* Top Section: Active Courts */}
                    <section>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-xl font-bold text-gray-700 flex items-center gap-2">
                                <i className="fa-solid fa-table-tennis-paddle-ball text-green-500"></i> 진행중인 코트
                            </h2>
                            <p className="text-sm text-gray-500">* 선수를 클릭하여 서로 교체할 수 있습니다.</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4">
                            {Array.from({ length: settings.numCourts }).map((_, i) => {
                                const courtNum = i + 1;
                                const match = activeMatches.find(m => m.courtNum === courtNum);

                                return (
                                    <div key={courtNum} className={`glass-panel p-4 flex flex-col justify-between ${match ? 'border-green-300 bg-green-50/50' : 'border-dashed border-gray-300'}`}>
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="bg-green-500 text-white px-3 py-1 rounded-lg text-sm font-bold shadow-sm">
                                                코트 {courtNum}
                                            </span>
                                            {match && (
                                                <div className="flex gap-2">
                                                    <button onClick={() => announceMatch(match)} className="text-blue-500 hover:text-blue-700 text-sm" title="재방송">
                                                        <i className="fa-solid fa-volume-high"></i>
                                                    </button>
                                                    <button onClick={() => finishMatch(match.id)} className="text-red-500 hover:text-red-700 text-sm" title="게임 종료">
                                                        <i className="fa-solid fa-check-circle"></i> 종료
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                        
                                        {match ? (
                                            <div className="grid grid-cols-2 gap-2">
                                                {match.players.map((p, idx) => {
                                                    const isSelected = swapSelection && swapSelection.matchId === match.id && swapSelection.player.id === p.id;
                                                    return (
                                                        <div key={idx} 
                                                             onClick={() => handlePlayerClickInCourt(match.id, p)}
                                                             className={`p-2 rounded-lg text-center cursor-pointer transition-all ${isSelected ? 'bg-yellow-200 border border-yellow-400 animate-pulse' : 'bg-white border border-gray-100 hover:border-green-300 hover:bg-green-50'}`}>
                                                            <div className="font-bold text-gray-800">{p.name}</div>
                                                            <div className="text-xs text-gray-500">{p.level} · {p.gender}</div>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        ) : (
                                            <div className="flex-1 flex items-center justify-center text-gray-400 text-sm">
                                                비어있음
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </section>

                    {/* Waiting Matches Section */}
                    {waitingMatches.length > 0 && (
                        <section className="bg-yellow-50 border border-yellow-200 rounded-2xl p-4">
                            <h2 className="text-lg font-bold text-yellow-800 mb-3 flex items-center gap-2">
                                <i className="fa-solid fa-hourglass-half"></i> 대기중인 게임 (코트 배정 대기)
                            </h2>
                            <div className="flex overflow-x-auto gap-4 pb-2">
                                {waitingMatches.map((match, index) => (
                                    <div key={match.id} className="min-w-[250px] bg-white p-3 rounded-xl shadow-sm border border-yellow-100">
                                        <div className="flex justify-between items-center mb-2 border-b pb-1">
                                            <span className="text-sm font-bold text-yellow-600">대기 {index + 1}순위</span>
                                            <button onClick={() => cancelWaitingMatch(match.id)} className="text-red-400 hover:text-red-600 text-xs">
                                                <i className="fa-solid fa-xmark"></i> 취소
                                            </button>
                                        </div>
                                        <div className="text-sm text-gray-700">
                                            {match.players.map(p => p.name).join(", ")}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    )}

                    {/* Main Content Area (QR & Waiting List) */}
                    <div className="flex flex-col lg:flex-row gap-6">
                        
                        {/* Left Side: QR Code & Tools */}
                        <aside className="w-full lg:w-1/4 space-y-4">
                            <div className="glass-panel p-5 text-center flex flex-col items-center justify-center">
                                <h3 className="font-bold text-gray-700 mb-2">모바일 자가입장 QR</h3>
                                <div 
                                    className="bg-white p-2 rounded-xl shadow-sm border border-gray-100 inline-block mb-2 cursor-pointer hover:border-green-400 hover:shadow-md transition-all"
                                    onClick={() => setShowRegister(true)}
                                    title="클릭하면 입장 양식이 열립니다 (테스트용)"
                                >
                                    <img src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.href.split('?')[0] + '?mode=mobile_register')}`} alt="QR Code" className="w-32 h-32" />
                                </div>
                                <p className="text-xs text-gray-500">카메라로 스캔하거나<br/><strong className="text-green-600">QR 코드를 클릭</strong>하여 등록하세요!</p>
                            </div>
                            
                            <div className="glass-panel p-5">
                                <h3 className="font-bold text-gray-700 mb-4">매치 메이킹</h3>
                                <div className="text-sm mb-4 text-center bg-gray-50 py-2 rounded-lg text-gray-600">
                                    현재 선택: <span className="font-bold text-green-600 text-lg">{selectedForMatch.length}</span> / 4 명
                                </div>
                                <button 
                                    onClick={createMatch}
                                    disabled={selectedForMatch.length !== 4}
                                    className={`w-full py-3 rounded-xl font-bold text-white transition-colors ${selectedForMatch.length === 4 ? 'bg-green-500 hover:bg-green-600 cute-button' : 'bg-gray-300 cursor-not-allowed'}`}
                                >
                                    게임 시작 (코트배정)
                                </button>
                            </div>
                        </aside>

                        {/* Right Side: Waiting Players List */}
                        <section className="w-full lg:w-3/4 glass-panel p-5 flex flex-col min-h-[600px]">
                            <div className="flex justify-between items-end mb-4 border-b border-gray-100 pb-2">
                                <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                                    <i className="fa-solid fa-users text-blue-400"></i> 대기자 명단 
                                    <span className="text-sm bg-blue-100 text-blue-700 px-2 py-1 rounded-full">{players.filter(p=>p.status!=='playing').length}명</span>
                                </h2>
                            </div>
                            
                            <div className="flex-1 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 auto-rows-max">
                                {players.filter(p => p.status !== 'playing').sort((a,b) => a.waitStartTime - b.waitStartTime).map(player => (
                                    <div key={player.id} 
                                         className={`relative rounded-2xl p-4 border-2 transition-all ${
                                            player.status === 'resting' ? 'bg-gray-100 border-gray-200 opacity-70' :
                                            selectedForMatch.includes(player.id) ? 'bg-green-50 border-green-400 shadow-md transform -translate-y-1' :
                                            'bg-white border-transparent shadow-sm hover:shadow-md cursor-pointer'
                                         }`}
                                         onClick={() => player.status !== 'resting' && toggleSelectForMatch(player.id)}
                                    >
                                        {/* Status Badge */}
                                        <div className="absolute top-2 right-2 flex gap-1">
                                            {player.status === 'resting' && <span className="bg-gray-400 text-white text-[10px] px-2 py-0.5 rounded-full">휴식중</span>}
                                            {selectedForMatch.includes(player.id) && <span className="bg-green-500 text-white text-[10px] px-2 py-0.5 rounded-full">선택됨</span>}
                                        </div>

                                        <div className="flex items-center gap-3 mb-3 mt-2">
                                            <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold text-white shadow-sm ${player.gender === '남' ? 'bg-blue-400' : 'bg-pink-400'}`}>
                                                {player.name.substring(0,1)}
                                            </div>
                                            <div>
                                                <div className="font-bold text-gray-800 text-lg leading-tight">{player.name}</div>
                                                <div className="text-xs text-gray-500 mt-1">{player.age} · {player.level}</div>
                                            </div>
                                        </div>

                                        <div className="bg-gray-50 rounded-lg p-2 text-xs flex justify-between text-gray-600 mb-3">
                                            <span>게임수: <strong className="text-gray-800">{player.gamesPlayed}</strong>전</span>
                                            <span>대기: <strong className="text-orange-500">{getWaitTime(player.waitStartTime)}</strong></span>
                                        </div>

                                        {/* Actions */}
                                        <div className="flex gap-2" onClick={(e) => e.stopPropagation()}>
                                            <button 
                                                onClick={() => handleStatusChange(player.id, player.status === 'resting' ? 'waiting' : 'resting')}
                                                className={`flex-1 text-xs py-1.5 rounded-lg font-semibold transition-colors ${player.status === 'resting' ? 'bg-blue-100 text-blue-600 hover:bg-blue-200' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                                            >
                                                {player.status === 'resting' ? '대기복귀' : '휴식'}
                                            </button>
                                            <button 
                                                onClick={() => handleRemovePlayer(player.id)}
                                                className="flex-1 bg-red-50 text-red-500 hover:bg-red-100 text-xs py-1.5 rounded-lg font-semibold transition-colors"
                                            >
                                                퇴장
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                
                                {players.filter(p => p.status !== 'playing').length === 0 && (
                                    <div className="col-span-full py-12 text-center text-gray-400">
                                        <i className="fa-regular fa-face-smile-wink text-4xl mb-3"></i>
                                        <p>대기 중인 선수가 없습니다.</p>
                                    </div>
                                )}
                            </div>
                        </section>
                    </div>

                    {/* Modals */}
                    
                    {/* Register Modal */}
                    {showRegister && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl animate-fade-in-up">
                                <div className="flex justify-between items-center mb-5">
                                    <h2 className="text-2xl font-bold text-gray-800">새 참가자 입장</h2>
                                    <button onClick={() => setShowRegister(false)} className="text-gray-400 hover:text-gray-600 text-xl"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <form onSubmit={handleRegisterPlayer} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">이름</label>
                                        <input required type="text" name="name" className="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-green-400 focus:ring-0 outline-none transition-colors" placeholder="홍길동" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">성별</label>
                                            <select name="gender" className="w-full border-2 border-gray-200 rounded-xl p-3 bg-white focus:border-green-400 outline-none">
                                                {settings.genders.map(g => <option key={g} value={g}>{g}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">연령대</label>
                                            <select name="age" className="w-full border-2 border-gray-200 rounded-xl p-3 bg-white focus:border-green-400 outline-none">
                                                {settings.ageGroups.map(a => <option key={a} value={a}>{a}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">급수</label>
                                        <select name="level" className="w-full border-2 border-gray-200 rounded-xl p-3 bg-white focus:border-green-400 outline-none">
                                            {settings.levels.map(l => <option key={l} value={l}>{l}</option>)}
                                        </select>
                                    </div>
                                    <button type="submit" className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl mt-4 cute-button shadow-md">
                                        입장 완료
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Admin Auth Modal */}
                    {showAdminAuth && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                                <h2 className="text-xl font-bold text-gray-800 mb-4 text-center">관리자 인증</h2>
                                <p className="text-xs text-gray-500 mb-4 text-center">구글시트에 설정된 인증번호를 입력하세요. (기본: 1234)</p>
                                <input type="password" id="adminPinInput" className="w-full border-2 border-gray-200 rounded-xl p-3 text-center tracking-widest text-2xl mb-4 focus:border-blue-400 outline-none" placeholder="****" />
                                <div className="flex gap-2">
                                    <button onClick={() => setShowAdminAuth(false)} className="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-200">취소</button>
                                    <button onClick={() => {
                                        const val = document.getElementById('adminPinInput').value;
                                        if (val === settings.adminPin) {
                                            setShowAdminAuth(false);
                                            setShowSettings(true);
                                        } else {
                                            alert("인증번호가 일치하지 않습니다.");
                                        }
                                    }} className="flex-1 bg-blue-500 text-white py-3 rounded-xl font-bold hover:bg-blue-600 cute-button">확인</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Settings Modal */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
                                <div className="flex justify-between items-center mb-5 border-b pb-3">
                                    <h2 className="text-xl font-bold text-gray-800"><i className="fa-solid fa-gear text-gray-500"></i> 프로그램 설정</h2>
                                    <button onClick={() => setShowSettings(false)} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">사용가능한 코트 수</label>
                                        <input type="number" min="1" max="10" 
                                               value={settings.numCourts} 
                                               onChange={(e) => setSettings({...settings, numCourts: parseInt(e.target.value) || 1})}
                                               className="w-full border-2 border-gray-200 rounded-xl p-3 outline-none focus:border-blue-400" />
                                        <p className="text-xs text-gray-400 mt-1">* 코트 수를 변경하면 화면 상단의 코트 개수가 실시간 반영됩니다.</p>
                                    </div>
                                    <div className="bg-blue-50 p-3 rounded-xl border border-blue-100">
                                        <h3 className="font-bold text-blue-800 text-sm mb-1"><i className="fa-solid fa-cloud"></i> 구글 시트 연동 정보</h3>
                                        <p className="text-xs text-blue-600 leading-relaxed">
                                            현재 데모버전은 기본값으로 설정되어 있습니다.<br/>
                                            실제 구글 시트 연동을 위해서는 해당 시트를 '링크가 있는 모든 사용자가 볼 수 있음'으로 변경하고, Fetch API를 통해 데이터를 파싱하도록 적용되어 있습니다.
                                        </p>
                                    </div>
                                    <button onClick={() => setShowSettings(false)} className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl mt-4 cute-button">
                                        저장 후 닫기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
